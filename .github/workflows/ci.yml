name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Uses placeholder values, not real secrets — nothing here talks to
      # Supabase/Razorpay/Resend, it only needs these env vars to be
      # *present* so the Next.js build doesn't throw on `process.env.X!`.
      - name: Typecheck
        run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

      - name: Lint
        run: npm run lint
